[project]
name = "ecommerce-api"
version = "1.0.0"
description = "API-first single-vendor e-commerce backend."
requires-python = ">=3.10"
dependencies = [
    "Django>=5.2.18,<5.3",
    "djangorestframework>=3.16.1,<3.17",
    "djangorestframework-simplejwt>=5.3,<6.0",
    "django-filter>=23.5,<26.0",
    "drf-spectacular>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
    "django-cors-headers>=4.4,<5.0",
    "django-unfold>=0.76,<0.110",
    "psycopg[binary]>=3.2,<4.0",
    "Pillow>=10.4,<13.0",
]

[project.optional-dependencies]
mysql = ["mysqlclient>=2.2,<3.0"]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-django>=4.8,<5.0",
    "ruff>=0.6,<1.0",
    "coverage>=7.6,<8.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "emarket.settings"
python_files = ["test_*.py", "*_tests.py", "tests.py"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
line-length = 160
target-version = "py310"
exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "DJ"]
ignore = ["DJ008", "DJ012"]
