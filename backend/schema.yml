components:
  schemas:
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        recipient:
          type: string
          maxLength: 120
        phone:
          type: string
          maxLength: 30
        line1:
          type: string
          maxLength: 255
        line2:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        country:
          type: string
          maxLength: 2
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - city
      - created_at
      - id
      - line1
      - phone
      - recipient
      - state
      - updated_at
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        actor:
          type: string
          readOnly: true
        action:
          type: string
          maxLength: 80
        entity_type:
          type: string
          maxLength: 80
        entity_id:
          type: string
          maxLength: 80
        details: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - created_at
      - entity_id
      - entity_type
      - id
    Brand:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        logo:
          type: string
          format: uri
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - slug
    Cart:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - items
      - subtotal
      - updated_at
    CartItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        variant:
          allOf:
          - $ref: '#/components/schemas/Variant'
          readOnly: true
        variant_id:
          type: integer
          writeOnly: true
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        line_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - id
      - line_total
      - quantity
      - variant
      - variant_id
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        is_active:
          type: boolean
        sort_order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        parent:
          type: integer
          nullable: true
      required:
      - created_at
      - id
      - name
      - slug
      - updated_at
    ChangePassword:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
      required:
      - current_password
      - new_password
    CheckoutRequest:
      type: object
      properties:
        address_id:
          type: integer
        shipping_method_id:
          type: integer
        coupon_code:
          type: string
          default: ''
        points:
          type: integer
          minimum: 0
          default: 0
      required:
      - address_id
      - shipping_method_id
    Coupon:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 40
        kind:
          $ref: '#/components/schemas/CouponKindEnum'
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        max_discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        minimum_subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
        total_limit:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        per_user_limit:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        products:
          type: array
          items:
            type: integer
        categories:
          type: array
          items:
            type: integer
      required:
      - code
      - created_at
      - id
      - kind
      - valid_from
      - valid_to
      - value
    CouponKindEnum:
      enum:
      - fixed
      - percent
      type: string
      description: |-
        * `fixed` - Fixed
        * `percent` - Percent
    CouponValidate:
      type: object
      properties:
        code:
          type: string
        address_id:
          type: integer
        shipping_method_id:
          type: integer
      required:
      - address_id
      - code
      - shipping_method_id
    LoyaltyAdjustment:
      type: object
      properties:
        user_id:
          type: integer
          minimum: 1
        delta:
          type: integer
        reason:
          type: string
          maxLength: 300
      required:
      - delta
      - reason
      - user_id
    LoyaltyTransaction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        delta:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/LoyaltyTransactionKindEnum'
          readOnly: true
        event_key:
          type: string
          readOnly: true
        metadata:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        wallet:
          type: integer
          readOnly: true
        order:
          type: integer
          readOnly: true
          nullable: true
      required:
      - created_at
      - delta
      - event_key
      - id
      - kind
      - metadata
      - order
      - wallet
    LoyaltyTransactionKindEnum:
      enum:
      - earn
      - redeem
      - reverse
      - adjust
      type: string
      description: |-
        * `earn` - Earn
        * `redeem` - Redeem
        * `reverse` - Reverse
        * `adjust` - Adjust
    MethodEnum:
      enum:
      - cod
      type: string
      description: '* `cod` - Cash on delivery'
    Notification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          type: string
          readOnly: true
        title:
          type: string
          readOnly: true
        message:
          type: string
          readOnly: true
        reference:
          type: string
          readOnly: true
        read_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
          readOnly: true
      required:
      - created_at
      - id
      - kind
      - message
      - read_at
      - reference
      - title
      - user
    Order:
