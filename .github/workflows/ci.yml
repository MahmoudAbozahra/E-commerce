name: Django CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ecommerce -d ecommerce"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DJANGO_SETTINGS_MODULE: emarket.settings
      DJANGO_SECRET_KEY: ci-only-test-secret-that-is-not-used-outside-github-actions
      DJANGO_DEBUG: 'true'
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ecommerce
      DB_USER: ecommerce
      DB_PASSWORD: ecommerce
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python -c "import django; django.setup(); from django.db import connection; connection.ensure_connection(); assert connection.vendor == 'postgresql'; print('Connected to PostgreSQL')"
      - run: python manage.py migrate --noinput
      - run: python manage.py seed_demo_store
      - run: python manage.py seed_demo_store
      - run: python -m pytest -vv
      - run: coverage run -m pytest && coverage report -m
      - run: ruff check account emarket order product
      - run: ruff format --check account emarket order product
      - run: python manage.py spectacular --file schema.yml --validate
